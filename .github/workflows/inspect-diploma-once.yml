name: Inspect diploma logo placement (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-diploma-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Read-only diploma thumbnail and dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          import base64,io
          from pathlib import Path
          p=Path('diploma-genel.png')
          img=Image.open(p).convert('RGB')
          print('DIPLOMA_SIZE', img.size,flush=True)
          preview=img.copy()
          preview.thumbnail((850,560))
          stream=io.BytesIO()
          preview.save(stream,'JPEG',quality=65,optimize=True)
          print('BEGIN_DIPLOMA_IMAGE',flush=True)
          print(base64.b64encode(stream.getvalue()).decode(),flush=True)
          print('END_DIPLOMA_IMAGE',flush=True)
          PY
