name: Verify original diploma-logo transfer quality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-diploma-logo-source.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Canva CDN logo image dimensions without modifying files
        run: |
          python -m pip install Pillow
          python - <<'PY'
          import urllib.request, io
          from PIL import Image
          base="https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F48c67e8e-c26b-4908-bf8d-da0932a192f3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALUq5S2JisbTi2RlyawqekTmOFqML7hb_DvU7llnoy6I&exp=1795284507&osig=AAAAAAAAAAAAAAAAAAAAANjxozBdEbp9O_UwDcEk_lLz0AH2sCkirN9JIzSHjls6&signer=media-rpc&token=AAIAAU0AJDQ4YzY3ZThlLWMyNmItNDkwOC1iZjhkLWRhMDkzMmExOTJmMwAAAAABof9LmXhIFfK3LaQYD7wJ6AKkRXQVdTOECmXXdF56S-paoNdoUg&x-canva-quality=thumbnail"
          for size in (200,400,600,800):
            u=base.replace("height:200",f"height:{size}").replace("width:200",f"width:{size}")
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                data=r.read()
              img=Image.open(io.BytesIO(data))
              print('IMAGE_SIZE',size,img.size,'bytes',len(data),flush=True)
            except Exception as e:
              print('IMAGE_SIZE',size,'ERROR',str(e)[:180],flush=True)
          PY
