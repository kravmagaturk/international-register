<script>
function downloadPDF(record, lang){
  record = record || lastSearchedRecord;
  lang = lang || 'tr';
  if(!record) return;

  var d = record;
  var isTR = lang === 'tr';

  Promise.all([
    loadTemplate('diploma'),
    makeQrDataUrl(buildQrUrl(d.registerNo))
  ]).then(function(parts){

    var bg = parts[0];
    var qr = parts[1];
    var jsPDF = window.jspdf.jsPDF;

    var W = 297;
    var H = 198;

    var doc = new jsPDF('l','mm',[H,W]);

    // PNG diploma şablonu
    doc.addImage(bg,'PNG',0,0,W,H);

    // =========================
    // ÖĞRENCİ ADI
    // =========================
    doc.setTextColor(15,15,15);
    doc.setFont('times','bold');

    var nm = turkishSafe(
      String(d.studentName || '').toUpperCase()
    );

    fitText(doc,nm,122,22,14);

    doc.text(
      nm,
      W/2,
      132,
      {align:'center'}
    );

    // =========================
    // SEVİYE / INSTRUCTOR
    // =========================
    doc.setFont('helvetica','bold');
    doc.setTextColor(185,20,20);

    var lvl = turkishSafe(
      String(d.level || '').toUpperCase()
    );

    fitText(doc,lvl,100,12,8);

    doc.text(
      lvl,
      W/2,
      146,
      {align:'center'}
    );

    // =========================
    // REGISTER NO + DATE
    // DAHA BÜYÜK
    // =========================
    doc.setFont('helvetica','bold');
    doc.setFontSize(12);
    doc.setTextColor(20,20,20);

    // REGISTER NO
    doc.text(
      turkishSafe(String(d.registerNo || '-')),
      43,
      174,
      {align:'center'}
    );

    // DATE
    doc.text(
      turkishSafe(String(d.examDate || '-')),
      149,
      174,
      {align:'center'}
    );

    // =========================
    // QR KOD
    // =========================
    if(qr){
      doc.addImage(
        qr,
        'PNG',
        249.5,
        110.5,
        28,
        28
      );
    }

    // =========================
    // PDF KAYDET
    // =========================
    doc.save(
      (isTR ? 'diploma-' : 'certificate-') +
      d.registerNo +
      '-' +
      lang +
      '.pdf'
    );

    logSecurityEvent('download',{
      studentName:d.studentName,
      registerNo:d.registerNo,
      lang:lang,
      type:'diploma'
    });

  }).catch(function(err){

    console.error(err);

    alert(
      'Diploma şablonu yüklenemedi: ' +
      err.message
    );

  });
}
</script>
